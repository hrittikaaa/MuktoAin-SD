# Continuous deployment to Azure App Service (free F1 Linux plan).
# Setup and required secrets: docs/deployment-guide.md, section 4.
#
# Required secrets:
#   AZURE_WEBAPP_PUBLISH_PROFILE — App Service publish profile XML
#   AZURE_SQL_PASSWORD            — SQL admin password for muktoainadmin
# Required variables:
#   AZURE_WEBAPP_NAME             — App Service name
#
# Runs on every push to main (after merge) and on demand from the Actions tab.
# ci.yml stays the build/test gate; this workflow only publishes and deploys.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push cancels an in-flight one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    # Skipped until the repo variable AZURE_WEBAPP_NAME is set, so forks and
    # repos without Azure configured stay green.
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # ── Database migrations ──────────────────────────────────────────
      # Run every scripts/*.sql file in numeric order against Azure SQL.
      # All scripts are idempotent (IF NOT EXISTS guards), so re-running
      # on every deploy is safe and keeps the schema in sync with code.
      # Skipped when AZURE_SQL_PASSWORD is not set (e.g. forks).
      - name: Apply database migrations
        env:
          SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: |
          if [ -z "$SQL_PASSWORD" ]; then
            echo "AZURE_SQL_PASSWORD not set, skipping migrations"
            exit 0
          fi
          if ! command -v sqlcmd >/dev/null; then
            curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc >/dev/null
            sudo add-apt-repository -y "$(curl -sSL https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list)"
            sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          fi
          SQLCMD=$(command -v sqlcmd || echo /opt/mssql-tools18/bin/sqlcmd)
          # 01_init_database.sql is local-only (CREATE DATABASE / ALTER DATABASE
          # are not valid inside an Azure SQL database); Azure creates MuktoAin.
          # 07_embedding_optimization.sql is one-time data cleanup, not a migration.
          for f in $(ls scripts/*.sql | grep -vE '01_init_database|07_embedding_optimization' | sort -t/ -k2 -V); do
            echo "==> Running $f ..."
            "$SQLCMD" -S tcp:muktoain-sql-hrittika.database.windows.net,1433 -d MuktoAin -U muktoainadmin -P "$SQL_PASSWORD" -C -b -I -i "$f"
          done
          echo "=== All migration scripts applied ==="

      # wwwroot/lib vendor libraries are git-ignored -- restore them via LibMan
      # so Bootstrap/jQuery ship inside the published output (same as Dockerfile).
      - name: Restore LibMan vendor libraries
        working-directory: src/MuktoAin.Web
        run: |
          dotnet tool install -g Microsoft.Web.LibraryManager.Cli
          libman restore

      - name: Unit tests
        run: dotnet test tests/MuktoAin.UnitTests/MuktoAin.UnitTests.csproj -c Release

      - name: Publish
        run: dotnet publish src/MuktoAin.Web/MuktoAin.Web.csproj -c Release -o ${{ runner.temp }}/publish

      # Startup seeders read data/*.json (SeedCategories reads categories.json on
      # every start) and SeedDataPathResolver looks in <ContentRoot>/data first.
      # Only the small committed seed files exist in the checkout; the large
      # git-ignored datasets are never shipped.
      - name: Bundle seed data
        run: |
          mkdir -p ${{ runner.temp }}/publish/data
          cp data/*.json ${{ runner.temp }}/publish/data/

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/publish
